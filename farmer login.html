<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Farming - Farmer Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #dff5df, #a8d5a2);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            background: white;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        .logo {
            text-align: center;
            font-size: 55px;
            margin-bottom: 5px;
        }

        h1 {
            text-align: center;
            color: #176b35;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #24552f;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #219653;
            box-shadow: 0 0 5px rgba(33,150,83,0.25);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #20863f;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #176b32;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .register a {
            color: #20863f;
            font-weight: bold;
            text-decoration: none;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #176b35;
            text-decoration: none;
        }

        @media(max-width:500px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">👨‍🌾</div>

    <h1>Farmer Login</h1>

    <p class="subtitle">
        Welcome to Modern Farming
    </p>

    <form id="loginForm">

        <!-- Farmer Name -->
        <div class="form-group">
            <label for="name">👤 Farmer Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>
        </div>


        <!-- Farmer ID -->
        <div class="form-group">
            <label for="farmerId">🆔 Farmer ID</label>

            <input
                type="text"
                id="farmerId"
                placeholder="Enter Farmer ID"
                required>
        </div>


        <!-- Email -->
        <div class="form-group">
            <label for="email">📧 Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
        </div>


        <!-- Mobile -->
        <div class="form-group">
            <label for="mobile">📱 Mobile Number</label>

            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                pattern="[0-9]{10}"
                maxlength="10"
                required>
        </div>


        <!-- Password -->
        <div class="form-group">
            <label for="password">🔐 Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                minlength="6"
                required>
        </div>


        <!-- Language -->
        <div class="form-group">
            <label for="language">🌐 Select Language</label>

            <select id="language">
                <option value="telugu">తెలుగు</option>
                <option value="english">English</option>
                <option value="hindi">हिन्दी</option>
            </select>
        </div>


        <button type="submit" class="login-btn">
            Login 🚜
        </button>

        <div id="message" class="message"></div>

    </form>


    <div class="register">
        New Farmer?
        <a href="#">Create Account</a>
    </div>

    <a href="index.html" class="back">
        ← Back to Modern Farming
    </a>

</div>


<script>

document.getElementById("loginForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const farmerId = document.getElementById("farmerId").value;
    const email = document.getElementById("email").value;
    const mobile = document.getElementById("mobile").value;
    const password = document.getElementById("password").value;

    const message = document.getElementById("message");

    if (name && farmerId && email && mobile && password) {

        message.style.color = "green";
        message.innerHTML = "✅ Login successful! Welcome " + name;

        // Save basic login state
        localStorage.setItem("farmerName", name);
        localStorage.setItem("farmerId", farmerId);

        setTimeout(function() {
            window.location.href = "index.html";
        }, 1500);

    } else {

        message.style.color = "red";
        message.innerHTML = "❌ Please fill all details.";

    }

});

</script>

</body>
</html>
