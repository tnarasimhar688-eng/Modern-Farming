<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modern Farming - Farmer Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #dff5d8, #f5fff2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 900px;
            max-width: 95%;
            min-height: 550px;
            background: white;
            border-radius: 25px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
        }

        /* LEFT SIDE */

        .left {
            width: 50%;
            background: #2e7d32;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .left .logo {
            font-size: 90px;
            margin-bottom: 20px;
        }

        .left h1 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .left p {
            line-height: 1.6;
            font-size: 16px;
        }

        /* RIGHT SIDE */

        .right {
            width: 50%;
            padding: 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .right h2 {
            text-align: center;
            color: #2e7d32;
            margin-bottom: 10px;
            font-size: 30px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .input-box input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #2e7d32;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: #1b5e20;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #666;
        }

        .register a {
            color: #2e7d32;
            font-weight: bold;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
            }

            .left {
                padding: 30px;
            }

            .left .logo {
                font-size: 60px;
            }

            .left h1 {
                font-size: 28px;
            }

            .right {
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LEFT -->

        <div class="left">

            <div class="logo">
                🌾
            </div>

            <h1>
                Modern Farming
            </h1>

            <p>
                Smart Farming<br>
                Better Future
            </p>

            <br>

            <p>
                Farmers kosam farming information,
                fertilizers, loans, government schemes,
                farming videos mariyu market information
                okka platform lo.
            </p>

        </div>


        <!-- RIGHT -->

        <div class="right">

            <h2>
                👨‍🌾 Farmer Login
            </h2>

            <p class="subtitle">
                Mee account lo login avvandi
            </p>


            <form id="loginForm">

                <div class="input-box">

                    <label>
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Mobile number enter cheyyandi"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="input-box">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password enter cheyyandi"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>

            </form>


            <p
                class="message"
                id="message"
            ></p>


            <div class="register">

                Account leda?

                <a onclick="register()">
                    Register cheyyandi
                </a>

            </div>

        </div>

    </div>


    <script>

        document
        .getElementById("loginForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            let mobile =
                document.getElementById("mobile").value;

            let password =
                document.getElementById("password").value;

            let message =
                document.getElementById("message");


            if (mobile.length !== 10) {

                message.style.color = "red";

                message.innerText =
                    "Correct 10 digit mobile number enter cheyyandi.";

                return;
            }


            if (password.length < 6) {

                message.style.color = "red";

                message.innerText =
                    "Password minimum 6 characters undali.";

                return;
            }


            message.style.color = "#2e7d32";

            message.innerText =
                "Login successful! Welcome Farmer 🌾";


            /*
                Next step lo ikkada backend API ni connect chestam.

                Example:

                fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        mobile: mobile,
                        password: password
                    })
                });
            */

        });


        function register() {

            alert(
                "Next step lo Farmer Registration page create chestam."
            );

        }

    </script>

</body>
</html>
